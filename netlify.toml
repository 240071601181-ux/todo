[build]
  command = "cd frontend && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "/api"

# API proxy to the Render backend. Rewrites /api/* to madtodo.onrender.com
# so all client-side requests keep pointing at the backend.
[[redirects]]
  from = "/api/*"
  to = "https://madtodo.onrender.com/api/:splat"
  status = 200

# React Router SPA fallback: every client-side route (e.g. /login, /dashboard,
# /tasks) serves index.html so hard refreshes never return Netlify's 404 page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
